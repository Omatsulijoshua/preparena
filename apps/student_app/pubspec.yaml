name: preparena_student
description: PrepArena Student App - Examination Preparation Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Routing
  go_router: ^14.2.8

  # API & Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0

  # Local Storage
  hive_flutter: ^1.1.0
  secure_storage: ^0.0.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3
  local_auth: ^2.3.0

  # UI Components
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3
  flutter_countdown_timer: ^4.1.0
  flutter_rating_bar: ^4.0.1
  fluttertoast: ^8.2.8
  lottie: ^3.1.3

  # LaTeX & Math
  flutter_math_fork: ^0.7.2

  # Offline
  connectivity_plus: ^6.1.0
  sqflite: ^2.4.1

  # Payments
  flutterwave: ^1.0.3
  paystack: ^1.0.2

  # Notifications
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.1
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.5
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
